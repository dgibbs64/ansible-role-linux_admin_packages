---
- name: "Test that history_time_format is set correctly"
  ansible.builtin.assert:
    that:
      - history_time_format is defined
      - history_time_format is boolean
    quiet: true

- name: "Test that systat_logging_enabled is set correctly"
  ansible.builtin.assert:
    that:
      - systat_logging_enabled is defined
      - systat_logging_enabled is boolean
    quiet: true

- name: "Test that vimrc is set correctly"
  ansible.builtin.assert:
    that:
      - vimrc is defined
      - vimrc is boolean
    quiet: true

- name: "Test that epel_repofile_path is set correctly"
  ansible.builtin.assert:
    that:
      - epel_repofile_path is defined
      - epel_repofile_path is string
    quiet: true
